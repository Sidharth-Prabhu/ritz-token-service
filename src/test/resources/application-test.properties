spring.application.name=ritz-token-service-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-compliance-2026
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=7200000
ritz.api.key=test-api-key-2026
payment.razorpay.enabled=false
ritz.token.exchange-rate=1.0
ritz.token.min-recharge-inr=10
ritz.token.max-recharge-inr=10000
ritz.token.low-balance-threshold=50
