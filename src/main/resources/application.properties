spring.application.name=ritz-token-service
server.port=${SERVER_PORT:8085}
server.address=0.0.0.0

# Database Configuration (PostgreSQL default on host, MySQL supported via profile or DB_URL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ritz_token_db}
spring.datasource.username=${DB_USERNAME:ritz_admin}
spring.datasource.password=${DB_PASSWORD:RitzSecurePassword2026}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:ritz-wallet-super-secure-production-ready-hmac-sha256-key-with-over-256-bits-entropy-for-rit-campus-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Legacy Ritz Service Security API Key (for backward compatibility)
ritz.api.key=${RITZ_API_KEY:ritz-secret-api-key-2026}

# Razorpay Configuration (Feature-flagged & disabled by default until compliance/approval)
payment.razorpay.enabled=${RAZORPAY_ENABLED:true}
payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_live_TqsjLUjcERj9ar}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:YCcqHG6AIkLB1upNH3Pbcxkv}
payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:YCcqHG6AIkLB1upNH3Pbcxkv}

# Token Economy & Conversions (1 token = 1 INR by default, configurable)
ritz.token.exchange-rate=${TOKEN_EXCHANGE_RATE:1.0}
ritz.token.currency=${TOKEN_CURRENCY:RITZ}
ritz.token.min-recharge-inr=${MIN_RECHARGE_INR:10}
ritz.token.max-recharge-inr=${MAX_RECHARGE_INR:10000}
ritz.token.low-balance-threshold=${LOW_BALANCE_THRESHOLD:50}

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
