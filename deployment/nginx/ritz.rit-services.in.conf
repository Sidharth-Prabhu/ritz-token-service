# ==============================================================================
# Nginx Reverse Proxy Configuration for RITZ Wallet
# Subdomain: ritz.rit-services.in
# DNS & CDN: Cloudflare Proxy (Orange Cloud)
# Target Service: RITZ Wallet Backend & Embedded Frontend (Port 8085)
# ==============================================================================

# WebSocket Connection Header Mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Rate Limiting Zones (Using Real Visitor IP restored by Cloudflare)
limit_req_zone $binary_remote_addr zone=ritz_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ritz_auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ritz_tx_limit:10m rate=50r/s;

# Upstream Definition for RITZ Wallet Service
upstream ritz_backend_service {
    server 127.0.0.1:8085;
    keepalive 32;
}

# ==============================================================================
# HTTP Server Block (Port 80)
# Handles Cloudflare Flexible SSL, ACME Challenges, and HTTPS Upgrades
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ritz.rit-services.in;

    # Include Cloudflare Real IP configuration
    include /etc/nginx/conf.d/cloudflare_ips.conf;

    # Let's Encrypt / Certbot ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # If Cloudflare SSL mode is set to "Flexible", route traffic directly to backend.
    # If Cloudflare SSL mode is "Full" or "Full (Strict)", redirect port 80 to 443:
    # return 301 https://$host$request_uri;

    # Standard Proxy Pass for HTTP / Cloudflare Flexible Mode
    location / {
        proxy_pass http://ritz_backend_service;
        proxy_http_version 1.1;

        # Forwarded Identity & Cloudflare Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Performance & Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Auth Endpoints (Rate Limited)
    location /api/v1/auth/ {
        limit_req zone=ritz_auth_limit burst=10 nodelay;
        proxy_pass http://ritz_backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Transaction Endpoints (Rate Limited)
    location /api/v1/transactions/ {
        limit_req zone=ritz_tx_limit burst=20 nodelay;
        proxy_pass http://ritz_backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

# ==============================================================================
# HTTPS Server Block (Port 443)
# Recommended for Cloudflare "Full" or "Full (Strict)" SSL Mode
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ritz.rit-services.in;

    # Include Cloudflare Real IP configuration
    include /etc/nginx/conf.d/cloudflare_ips.conf;

    # --------------------------------------------------------------------------
    # SSL Certificate Paths
    # Option A: Cloudflare Origin CA Certificate (Recommended for Full Strict)
    # Generate in Cloudflare Dashboard -> SSL/TLS -> Origin Server -> Create Certificate
    ssl_certificate /etc/ssl/certs/ritz.rit-services.in.pem;
    ssl_certificate_key /etc/ssl/private/ritz.rit-services.in.key;

    # Option B: Let's Encrypt / Certbot Certificate (Alternative)
    # ssl_certificate /etc/letsencrypt/live/ritz.rit-services.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ritz.rit-services.in/privkey.pem;
    # --------------------------------------------------------------------------

    # Modern TLS Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:RITZ_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; frame-src 'self' https://api.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: http:;" always;

    # Gzip Compression for Fast Frontend Asset Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Health Check (Direct Actuator Bypass)
    location /actuator/health {
        proxy_pass http://ritz_backend_service/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Swagger UI & OpenAPI Specification
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://ritz_backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Auth Endpoints (Rate Limited)
    location /api/v1/auth/ {
        limit_req zone=ritz_auth_limit burst=10 nodelay;
        proxy_pass http://ritz_backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Transaction Endpoints (Rate Limited)
    location /api/v1/transactions/ {
        limit_req zone=ritz_tx_limit burst=20 nodelay;
        proxy_pass http://ritz_backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # General Web Application & API Proxy
    location / {
        limit_req zone=ritz_api_limit burst=30 nodelay;
        proxy_pass http://ritz_backend_service;
        proxy_http_version 1.1;

        # Forwarded Identity & Cloudflare Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
