# RITZ Wallet - Production Nginx Reverse Proxy Configuration
# Rajalakshmi Institute of Technology (RIT)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zones (DDoS and Brute-Force Prevention)
    # 1. API general limit: 20 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    # 2. Strict auth limit: 5 req/s per IP for login/recharge
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    # 3. Application integration limit: 50 req/s per API Key / IP
    limit_req_zone $binary_remote_addr zone=api_tx:10m rate=50r/s;

    # Upstream backend definition
    upstream ritz_backend {
        server backend:8085;
        keepalive 32;
    }

    # HTTP Server - Redirect to HTTPS (or serve directly if SSL not enabled)
    server {
        listen 80;
        listen [::]:80;
        server_name ritz.ritchennai.edu.in localhost;

        # Let's Encrypt ACME challenge endpoint
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # If HTTPS is active, redirect HTTP to HTTPS:
        # return 301 https://$host$request_uri;

        # Static Frontend Assets (SPA)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Browser cache for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Spring Boot Actuator Health Check (Internal monitoring)
        location /actuator/health {
            proxy_pass http://ritz_backend/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # Swagger UI and OpenAPI Docs
        location ~ ^/(swagger-ui|v3/api-docs) {
            proxy_pass http://ritz_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth Endpoints (Rate Limited)
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://ritz_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Transaction Endpoints (Rate Limited)
        location /api/v1/transactions/ {
            limit_req zone=api_tx burst=20 nodelay;
            proxy_pass http://ritz_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General REST API Proxy
        location /api/ {
            limit_req zone=api_general burst=30 nodelay;
            proxy_pass http://ritz_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; frame-src 'self' https://api.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http: https:;" always;
    }

    # HTTPS Server (Uncomment when SSL certificates are installed)
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name ritz.ritchennai.edu.in;
    #
    #     ssl_certificate /etc/letsencrypt/live/ritz.ritchennai.edu.in/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/ritz.ritchennai.edu.in/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     # HSTS (Strict-Transport-Security)
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # Same location blocks as HTTP server above
    # }
}
